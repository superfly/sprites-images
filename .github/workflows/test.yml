name: Test

on:
  merge_group:
  pull_request:

concurrency:
  group: test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  AWS_REGION: auto
  AWS_ENDPOINT_URL_S3: https://t3.storage.dev
  BUCKET: ${{ vars.CACHE_S3_BUCKET }}

jobs:
  test:
    name: Build and test images
    runs-on:
      group: sprite-env-amd64
    permissions:
      contents: read
    env:
      BUILDER: test-${{ github.run_id }}-${{ github.run_attempt }}
      CI_FILES: .github/workflows/test.yml scripts/changed-targets.sh

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Docker
        run: |
          # The default backend doesn't support S3 caching
          docker buildx create --name "$BUILDER" --driver docker-container --bootstrap || {
            echo "::error::failed to create buildx builder" >&2
            exit 1
          }

      - name: Detect changes
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          docker buildx bake --print default > "$RUNNER_TEMP/bake.json" || {
            echo "::error::failed to read docker-bake.hcl" >&2
            exit 1
          }
          TARGETS=$(jq -r '.group.default.targets | join(" ")' "$RUNNER_TEMP/bake.json")
          echo "targets=$TARGETS" >> "$GITHUB_OUTPUT"

          git fetch --depth=1 origin "$BASE_SHA" || {
            echo "::error::failed to fetch $BASE_SHA" >&2
            exit 1
          }
          git diff --name-only "$BASE_SHA" HEAD > "$RUNNER_TEMP/changes" || {
            echo "::error::failed to diff against $BASE_SHA" >&2
            exit 1
          }
          if git diff --quiet "$BASE_SHA" HEAD -- $CI_FILES
          then
              CHANGED=$(scripts/changed-targets.sh default < "$RUNNER_TEMP/changes") || {
              echo "::error::failed to determine changed targets" >&2
                exit 1
              }
              CHANGED=$(printf '%s\n' "$CHANGED" | paste -sd ' ' -)
              TESTS=$(scripts/changed-targets.sh test < "$RUNNER_TEMP/changes") || {
                echo "::error::failed to determine changed tests" >&2
                exit 1
              }
              TESTS=$(printf '%s\n' "$TESTS" | paste -sd ' ' -)
          else
              CHANGED=$TARGETS
              docker buildx bake --print test > "$RUNNER_TEMP/bake-test.json" || {
                echo "::error::failed to read docker-bake.hcl" >&2
                exit 1
              }
              TESTS=$(jq -r '.group.test.targets | join(" ")' "$RUNNER_TEMP/bake-test.json")
          fi
          echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"
          echo "tests=$TESTS" >> "$GITHUB_OUTPUT"

      - name: Build images
        id: build
        if: steps.changes.outputs.changed != '' || steps.changes.outputs.tests != ''
        env:
          BRANCH: ${{ github.head_ref || github.event.merge_group.base_ref }}
          CHANGED: ${{ steps.changes.outputs.changed }}
          TESTS: ${{ steps.changes.outputs.tests }}
          AWS_ACCESS_KEY_ID: ${{ secrets.CACHE_S3_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CACHE_S3_SECRET_ACCESS_KEY }}
        run: |
          # Use a separate cache for each target. Read from both the current and
          # main branch caches. Write the result back to the current branch.
          jq --arg bucket "$BUCKET" --arg branch "${BRANCH#refs/heads/}" --arg oci "$RUNNER_TEMP/oci" '
              def ref($name):
                  "type=s3,region=\($ENV.AWS_REGION),endpoint_url=\($ENV.AWS_ENDPOINT_URL_S3),bucket=\($bucket),name=\($name)";
              ($branch | gsub("[^A-Za-z0-9._/-]"; "-")) as $branch
              | {target: (.target | keys | map({key: ., value: {
                  output: ["type=oci,tar=false,dest=\($oci),rewrite-timestamp=true", "type=tar,dest=-"],
                  "cache-from": [ref("\(.)-\($branch)"), ref("\(.)-main")],
                  "cache-to": [ref("\(.)-\($branch)") + ",mode=max,ignore-error=true"]
              }}) | from_entries)}
          ' "$RUNNER_TEMP/bake.json" > "$RUNNER_TEMP/cache.json"

          docker buildx bake --print default test > "$RUNNER_TEMP/bake-all.json" || {
            echo "::error::failed to read docker-bake.hcl" >&2
            exit 1
          }

          # When bake targets share steps through target: contexts, BuildKit
          # doesn't reuse the cached results (moby/buildkit#6418,
          # docker/buildx#414). To work around this, bake one target at a time
          # and swap its target: contexts for unpacked oci-layout images.
          # Somehow this is still faster.
          ORDER=$(
              jq -r --arg changed "$CHANGED" --arg tests "$TESTS" '
                  . as $bake
                  | def deps($t):
                      $bake.target[$t].contexts // {} | .[]
                      | select(startswith("target:")) | ltrimstr("target:");
                    def visit($t):
                      if any(.[]; . == $t) then . else (reduce deps($t) as $d (.; visit($d))) + [$t] end;
                  ($changed | split(" ")) + [$tests | split(" ")[] | select(. != "") | deps(.)]
                  | reduce (.[] | select(. != "")) as $t ([]; visit($t))
                  | join(" ")
              ' "$RUNNER_TEMP/bake-all.json"
          ) || {
            echo "::error::failed to order targets" >&2
            exit 1
          }

          mkdir -p "$RUNNER_TEMP/oci" "$RUNNER_TEMP/metadata" "$RUNNER_TEMP/uncompressed"
          echo '{}' > "$RUNNER_TEMP/contexts.json"
          for target in $ORDER
          do
              docker buildx bake --builder "$BUILDER" --allow "fs=$RUNNER_TEMP/oci" \
                  -f docker-bake.hcl -f docker-bake.json \
                  -f "$RUNNER_TEMP/cache.json" -f "$RUNNER_TEMP/contexts.json" \
                  --metadata-file "$RUNNER_TEMP/metadata/$target.json" \
                  "$target" | wc -c > "$RUNNER_TEMP/uncompressed/$target" || {
                echo "::error::failed to build $target" >&2
                exit 1
              }
              jq -s add "$RUNNER_TEMP"/metadata/*.json > "$RUNNER_TEMP/metadata.json"

              jq --slurpfile metadata "$RUNNER_TEMP/metadata.json" --arg oci "$RUNNER_TEMP/oci" '
                  {target: (.target | map_values({contexts: (.contexts // {} | with_entries(
                      (.value | ltrimstr("target:")) as $dep
                      | select((.value | startswith("target:")) and $metadata[0][$dep] != null)
                      | .value = "oci-layout://\($oci)@\($metadata[0][$dep]["containerimage.digest"])"
                  ))}))}
              ' "$RUNNER_TEMP/bake-all.json" > "$RUNNER_TEMP/contexts.json" || {
                echo "::error::failed to resolve the $target contexts" >&2
                exit 1
              }
          done

      - name: Measure layer sizes
        id: sizes
        if: steps.changes.outputs.changed != ''
        env:
          TARGETS: ${{ steps.changes.outputs.changed }}
        run: |
          mkdir -p "$RUNNER_TEMP/sizes"
          for target in $TARGETS
          do
              ref=$(
                  jq -r --arg t "$target" '.[$t]["buildx.build.ref"] // empty' \
                      "$RUNNER_TEMP/metadata.json"
              )
              test -n "$ref" || continue

              manifest="$RUNNER_TEMP/manifest-$target.json"
              docker buildx history inspect attachment --builder "$BUILDER" \
                  "${ref##*/}" --type manifest > "$manifest" || {
                echo "::error::failed to read the $target manifest" >&2
                exit 1
              }
              jq --slurpfile uncompressed "$RUNNER_TEMP/uncompressed/$target" '{
                  layers: (.layers | length),
                  compressed: (.layers | map(.size) | add // 0),
                  uncompressed: $uncompressed[0]
              }' "$manifest" > "$RUNNER_TEMP/sizes/$target.json" || {
                echo "::error::failed to measure the $target layers" >&2
                exit 1
              }
          done

      - name: Run tests
        if: steps.changes.outputs.tests != ''
        env:
          TESTS: ${{ steps.changes.outputs.tests }}
        run: |
          docker buildx bake --builder "$BUILDER" --allow "fs=$RUNNER_TEMP/oci" \
              -f docker-bake.hcl -f docker-bake.json -f "$RUNNER_TEMP/contexts.json" \
              $TESTS || {
            echo "::error::image tests failed" >&2
            exit 1
          }

      - name: Generate app token
        if: always() && github.event_name == 'pull_request' && steps.sizes.outcome == 'success'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ secrets.SPRITES_BOT_CLIENT_ID }}
          private-key: ${{ secrets.SPRITES_BOT_PRIVATE_KEY }}
          permission-pull-requests: write

      - name: Comment image sizes
        if: always() && github.event_name == 'pull_request' && steps.sizes.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          TARGETS: ${{ steps.changes.outputs.targets }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          body="$RUNNER_TEMP/comment.md"
          cat << EOF > "$body"
          ### Image sizes

          | Target | Layers | Compressed | Uncompressed |
          | --- | ---: | ---: | ---: |
          $(
              for target in $TARGETS
              do
                  sizes="$RUNNER_TEMP/sizes/$target.json"
                  if test -f "$sizes"
                  then
                      count=$(jq '.layers' "$sizes")
                      compressed=$(
                          numfmt --to=iec-i --suffix=B "$(jq '.compressed' "$sizes")"
                      )
                      uncompressed=$(
                          numfmt --to=iec-i --suffix=B "$(jq '.uncompressed' "$sizes")"
                      )
                      echo "| $target | $count | $compressed | $uncompressed |"
                  else
                      echo "| $target | unchanged | | |"
                  fi
              done
          )

          __Run for commit ${HEAD_SHA:0:7}. ([Run]($RUN_URL))__
          EOF

          gh pr comment "$PR_NUMBER" --body-file "$body" || {
            echo "::error::failed to comment on pull request #$PR_NUMBER" >&2
            exit 1
          }

      - name: Remove buildx builder
        if: always()
        run: docker buildx rm --force "$BUILDER" || true
