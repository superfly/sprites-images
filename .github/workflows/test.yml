name: Test

on:
  merge_group:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Build and test images
    runs-on:
      group: sprite-env-amd64
    permissions:
      contents: read
    env:
      BUILDX_BUILDER: test-${{ github.run_id }}-${{ github.run_attempt }}
      CI_FILES: .github/workflows/test.yml

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Docker
        run: |
          # The default backend doesn't support S3 caching
          docker buildx create --name "$BUILDX_BUILDER" --driver docker-container --bootstrap || {
            echo "::error::failed to create buildx builder" >&2
            exit 1
          }

      - name: Plan build
        id: changes
        uses: $/.github/actions/bake-plan
        with:
          group: default
          base-sha: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          force-files: ${{ env.CI_FILES }}

      - name: Restore ccache
        if: contains(steps.changes.outputs.changed, 'sprites-classic-languages')
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ccache-

      - name: Load ccache into builder
        if: contains(steps.changes.outputs.changed, 'sprites-classic-languages')
        run: |
          mkdir -p "$RUNNER_TEMP/ccache"
          docker buildx build --output type=cacheonly \
              -f - "$RUNNER_TEMP/ccache" << 'EOF' || {
          FROM busybox:1.38.0@sha256:fd7dc98638c8e305f4dc34e979f1c0fdfdcaeb0fbf8fcff77ae834b6da3d7e6e
          RUN --mount=type=cache,id=ccache,target=/var/cache/ccache \
              --mount=type=bind,target=/ccache \
              cp -a /ccache/. /var/cache/ccache/
          EOF
            echo "::error::failed to load ccache into the builder" >&2
            exit 1
          }

      - name: Build images
        if: steps.changes.outputs.changed != '' || steps.changes.outputs.tests != ''
        uses: $/.github/actions/bake-build
        with:
          dir: ${{ steps.changes.outputs.dir }}
          order: ${{ steps.changes.outputs.order }}
          outputs: type=tar,dest=-
          cache-bucket: ${{ vars.CACHE_S3_BUCKET }}
          cache-access-key-id: ${{ secrets.CACHE_S3_ACCESS_KEY }}
          cache-secret-access-key: ${{ secrets.CACHE_S3_SECRET_ACCESS_KEY }}
          # Read from both the current and main branch caches. Write the result
          # back to the current branch.
          cache-from: ${{ github.head_ref || github.event.merge_group.base_ref || github.ref_name }} main
          cache-to: ${{ github.head_ref || github.event.merge_group.base_ref || github.ref_name }}

      - name: Refresh ccache
        if: github.event_name == 'push' && contains(steps.changes.outputs.changed, 'sprites-classic-languages')
        env:
          BAKE_DIR: ${{ steps.changes.outputs.dir }}
        run: |
          # main's layers are already cached, so rerun the compiled stages to
          # fill the shared ccache. Force the rerun with CCACHE_REFRESH, since
          # no-cache-filter gives RUN an empty cache mount.
          jq -n --arg refresh "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" '
              {target: (["erlang", "ruby", "python"] | map({key: "ccache-\(.)", value: {
                  inherits: ["sprites-classic-languages"],
                  target: .,
                  args: {CCACHE_REFRESH: $refresh},
                  output: ["type=cacheonly"]
              }}) | from_entries)}
          ' > "$RUNNER_TEMP/ccache.json"

          BUILDX_BAKE_FILE=$BUILDX_BAKE_FILE:$RUNNER_TEMP/ccache.json \
              docker buildx bake --allow "fs=$BAKE_DIR/oci" \
              ccache-erlang ccache-ruby ccache-python || {
            echo "::error::failed to refresh ccache" >&2
            exit 1
          }

      - name: Extract ccache from builder
        if: contains(steps.changes.outputs.changed, 'sprites-classic-languages')
        run: |
          rm -rf "$RUNNER_TEMP/ccache"
          mkdir -p "$RUNNER_TEMP/empty"
          docker buildx build \
              --output "type=local,dest=$RUNNER_TEMP/ccache" \
              -f - "$RUNNER_TEMP/empty" << 'EOF' || {
          FROM busybox:1.38.0@sha256:fd7dc98638c8e305f4dc34e979f1c0fdfdcaeb0fbf8fcff77ae834b6da3d7e6e AS extract
          RUN --mount=type=cache,id=ccache,target=/var/cache/ccache \
              cp -a /var/cache/ccache /ccache

          FROM scratch
          COPY --from=extract /ccache /
          EOF
            echo "::error::failed to extract ccache from the builder" >&2
            exit 1
          }

      - name: Save ccache
        if: contains(steps.changes.outputs.changed, 'sprites-classic-languages')
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Measure layer sizes
        id: sizes
        if: steps.changes.outputs.changed != ''
        env:
          BAKE_DIR: ${{ steps.changes.outputs.dir }}
          TARGETS: ${{ steps.changes.outputs.changed }}
        run: |
          mkdir -p "$RUNNER_TEMP/sizes"
          for target in $TARGETS
          do
              ref=$(
                  jq -r --arg t "$target" '.[$t]["buildx.build.ref"] // empty' \
                      "$BAKE_DIR/metadata.json"
              )
              test -n "$ref" || continue

              manifest="$RUNNER_TEMP/manifest-$target.json"
              docker buildx history inspect attachment \
                  "${ref##*/}" --type manifest > "$manifest" || {
                echo "::error::failed to read the $target manifest" >&2
                exit 1
              }
              jq --slurpfile uncompressed "$BAKE_DIR/stdout-bytes/$target" '{
                  layers: (.layers | length),
                  compressed: (.layers | map(.size) | add // 0),
                  uncompressed: $uncompressed[0]
              }' "$manifest" > "$RUNNER_TEMP/sizes/$target.json" || {
                echo "::error::failed to measure the $target layers" >&2
                exit 1
              }
          done

      - name: Run tests
        if: steps.changes.outputs.tests != ''
        env:
          BAKE_DIR: ${{ steps.changes.outputs.dir }}
          TESTS: ${{ steps.changes.outputs.tests }}
        run: |
          docker buildx bake --allow "fs=$BAKE_DIR/oci" \
              $TESTS || {
            echo "::error::image tests failed" >&2
            exit 1
          }

      - name: Generate app token
        if: always() && github.event_name == 'pull_request' && steps.sizes.outcome == 'success'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ secrets.SPRITES_BOT_CLIENT_ID }}
          private-key: ${{ secrets.SPRITES_BOT_PRIVATE_KEY }}
          permission-pull-requests: write

      - name: Comment image sizes
        if: always() && github.event_name == 'pull_request' && steps.sizes.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          TARGETS: ${{ steps.changes.outputs.targets }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          body="$RUNNER_TEMP/comment.md"
          cat << EOF > "$body"
          ### Image sizes

          | Target | Layers | Compressed | Uncompressed |
          | --- | ---: | ---: | ---: |
          $(
              for target in $TARGETS
              do
                  sizes="$RUNNER_TEMP/sizes/$target.json"
                  if test -f "$sizes"
                  then
                      count=$(jq '.layers' "$sizes")
                      compressed=$(
                          numfmt --to=iec-i --suffix=B "$(jq '.compressed' "$sizes")"
                      )
                      uncompressed=$(
                          numfmt --to=iec-i --suffix=B "$(jq '.uncompressed' "$sizes")"
                      )
                      echo "| $target | $count | $compressed | $uncompressed |"
                  else
                      echo "| $target | unchanged | | |"
                  fi
              done
          )

          __Run for commit ${HEAD_SHA:0:7}. ([Run]($RUN_URL))__
          EOF

          gh pr comment "$PR_NUMBER" --body-file "$body" || {
            echo "::error::failed to comment on pull request #$PR_NUMBER" >&2
            exit 1
          }

      - name: Remove buildx builder
        if: always()
        run: docker buildx rm --force "$BUILDX_BUILDER" || true

  publish:
    name: Publish images
    needs: [test]
    if: github.event_name == 'push'
    permissions:
      actions: read
      contents: read
      packages: write
    uses: ./.github/workflows/build.yml
    secrets: inherit
